name: Apply issue 171 return logistics wire slice once

on:
  push:
    branches:
      - issue-171-return-logistics-wire
    paths:
      - scripts/issue171_apply_return_logistics_wire.py
      - .github/workflows/issue171-return-logistics-wire-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-return-logistics-wire

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Apply Core return logistics contract
        run: python scripts/issue171_apply_return_logistics_wire.py

      - name: Keep return contract fixture consistent with default positions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_issue171_return_logistics_contract.py")
          text = path.read_text()
          old_import = '''    _charges_definition,
    _default_positions,
    _snapshot,
)'''
          new_import = '''    _charges_definition,
    _default_positions,
    _dishware_line_def,
    _snapshot,
)'''
          assert text.count(old_import) == 1, text.count(old_import)
          text = text.replace(old_import, new_import, 1)
          old = "_charges_definition(dishware_lines=[])"
          count = text.count(old)
          assert count == 5, count
          text = text.replace(old, "_charges_definition(dishware_lines=[_dishware_line_def()])")
          path.write_text(text)
          PY

      - name: Install project and development tools
        run: uv sync --dev

      - name: Format and test changed slice
        run: |
          uv run ruff format \
            src/catering_system/services/offer_snapshot_validation.py \
            src/catering_system/repositories/sqlite_offer_repository.py \
            src/catering_system/domain/order_commercial_snapshot.py \
            src/catering_system/repositories/sqlite_order_commercial_snapshot_repository.py \
            tests/unit/test_issue171_return_logistics_contract.py \
            tests/unit/test_issue171_return_logistics_offer_persistence.py \
            tests/unit/test_issue171_return_logistics_order.py \
            tests/unit/test_order_commercial_snapshot_repository.py
          uv run ruff check \
            src/catering_system/services/offer_snapshot_validation.py \
            src/catering_system/repositories/sqlite_offer_repository.py \
            src/catering_system/domain/order_commercial_snapshot.py \
            src/catering_system/repositories/sqlite_order_commercial_snapshot_repository.py \
            tests/unit/test_issue171_return_logistics_contract.py \
            tests/unit/test_issue171_return_logistics_offer_persistence.py \
            tests/unit/test_issue171_return_logistics_order.py \
            tests/unit/test_order_commercial_snapshot_repository.py
          uv run mypy src/catering_system
          uv run pytest -q \
            tests/unit/test_issue171_return_logistics_domain.py \
            tests/unit/test_issue171_return_logistics_contract.py \
            tests/unit/test_issue171_return_logistics_offer_persistence.py \
            tests/unit/test_issue171_return_logistics_order.py \
            tests/unit/test_order_commercial_snapshot_repository.py \
            tests/unit/test_offer_charges_validation.py

      - name: Commit tested Core slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/catering_system/services/offer_snapshot_validation.py \
            src/catering_system/repositories/sqlite_offer_repository.py \
            src/catering_system/domain/order_commercial_snapshot.py \
            src/catering_system/repositories/sqlite_order_commercial_snapshot_repository.py \
            tests/unit/test_issue171_return_logistics_contract.py \
            tests/unit/test_issue171_return_logistics_offer_persistence.py \
            tests/unit/test_issue171_return_logistics_order.py \
            tests/unit/test_order_commercial_snapshot_repository.py
          git commit -m "Issue #171: persist return logistics through Core"
          git push origin HEAD:issue-171-return-logistics-wire
