name: RBAC Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/order-hard-delete
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/catering_system/domain/employee_auth.py')
          lines = p.read_text().splitlines()
          if '    "orders.delete",' not in lines:
              out=[]; count=0
              for line in lines:
                  out.append(line)
                  if line.strip() == '"orders.cancel",':
                      count += 1
                      if count <= 3:
                          out.append(line[:len(line)-len(line.lstrip())] + '"orders.delete",')
              if count < 3: raise SystemExit('orders.cancel anchors missing')
              p.write_text('\n'.join(out)+'\n')

          p = Path('src/catering_system/ui/office_panel_order_detail.py')
          s=p.read_text()
          s=s.replace('if context.current_user_role_label == "Superadmin" and delete_confirmation_name:', 'if context.can("orders.delete") and delete_confirmation_name:', 1)
          p.write_text(s)

          p = Path('src/catering_system/ui/office_panel_http.py')
          s=p.read_text()
          s=s.replace('"delete": ("orders.cancel",),', '"delete": ("orders.delete",),', 1)
          s=s.replace('or auth.employee.account.role != "SUPERADMIN"', 'or "orders.delete" not in auth.employee.effective_permissions', 1)
          needle='''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            expected_name = (
'''
          repl='''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            if operational_data is None:
                raise ValueError("order_delete_name_unavailable")
            expected_name = (
'''
          s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('tests/unit/test_order_hard_delete.py')
          s=p.read_text()
          s=s.replace('current_user_role_label="Superadmin",','current_user_role_label="Administrator",\n        employee_effective_permissions=frozenset({"orders.delete"}),',1)
          p.write_text(s)
          PY
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.32'
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run ruff format src/catering_system/domain/employee_auth.py src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_order_detail.py tests/unit/test_order_hard_delete.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catering_system/domain/employee_auth.py src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_order_detail.py tests/unit/test_order_hard_delete.py
          git commit -m 'fix: authorize order delete by permission'
          git push origin HEAD:feat/order-hard-delete
