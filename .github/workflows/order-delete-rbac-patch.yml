name: Order Delete RBAC Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/order-hard-delete
      - name: Apply permission model and nullable guard
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/catering_system/domain/employee_auth.py')
          lines = auth_path.read_text().splitlines()
          out = []
          seen = 0
          for line in lines:
              out.append(line)
              if line.strip() == '"orders.cancel",':
                  seen += 1
                  if seen <= 3:
                      indent = line[:len(line)-len(line.lstrip())]
                      out.append(indent + '"orders.delete",')
          if seen < 3:
              raise SystemExit(f'expected >=3 orders.cancel entries, got {seen}')
          auth_path.write_text('\n'.join(out) + '\n')

          detail_path = Path('src/catering_system/ui/office_panel_order_detail.py')
          detail_text = detail_path.read_text()
          old = 'if context.current_user_role_label == "Superadmin" and delete_confirmation_name:'
          if old not in detail_text:
              raise SystemExit('detail role guard not found')
          detail_path.write_text(detail_text.replace(old, 'if context.can("orders.delete") and delete_confirmation_name:', 1))

          http_path = Path('src/catering_system/ui/office_panel_http.py')
          http_text = http_path.read_text()
          old_perm = '"delete": ("orders.cancel",),'
          if old_perm not in http_text:
              raise SystemExit('HTTP permission mapping not found')
          http_text = http_text.replace(old_perm, '"delete": ("orders.delete",),', 1)
          old_guard = '''            if (
                auth is None
                or auth.kind != "employee"
                or auth.employee is None
                or auth.legacy_shared_access
                or auth.employee.account.role != "SUPERADMIN"
            ):
'''
          new_guard = '''            if (
                auth is None
                or auth.kind != "employee"
                or auth.employee is None
                or auth.legacy_shared_access
                or "orders.delete" not in auth.employee.effective_permissions
            ):
'''
          if old_guard not in http_text:
              raise SystemExit('HTTP superadmin guard not found')
          http_text = http_text.replace(old_guard, new_guard, 1)
          needle = '''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            expected_name = (
'''
          replacement = '''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            if operational_data is None:
                raise ValueError("order_delete_name_unavailable")
            expected_name = (
'''
          if needle in http_text:
              http_text = http_text.replace(needle, replacement, 1)
          elif 'if operational_data is None:' not in http_text:
              raise SystemExit('nullable operational-data target not found')
          http_path.write_text(http_text)

          test_path = Path('tests/unit/test_order_hard_delete.py')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              'current_user_role_label="Superadmin",',
              'current_user_role_label="Administrator",\n        employee_effective_permissions=frozenset({"orders.delete"}),',
          )
          test_text = test_text.replace(
              'current_user_role_label="Benutzer",',
              'current_user_role_label="Benutzer",\n        employee_effective_permissions=frozenset(),',
          )
          test_path.write_text(test_text)
          PY
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.32
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run ruff format src/catering_system/domain/employee_auth.py src/catering_system/repositories/order_purge.py src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_order_detail.py tests/unit/test_order_hard_delete.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catering_system/domain/employee_auth.py src/catering_system/repositories/order_purge.py src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_order_detail.py tests/unit/test_order_hard_delete.py
          git commit -m "fix: authorize order delete by permission"
          git push origin HEAD:feat/order-hard-delete
