name: Patch Superadmin revoke test

on:
  push:
    branches:
      - fix/superadmin-permission-registry

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/superadmin-permission-registry
      - name: Patch test and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_office_api.py')
          text = path.read_text()
          old = '''def test_permission_revoked_after_mint_rejected(api) -> None:\n    base, ids, db = api\n    auth = _employee_auth(db)\n    code, handoff_id = _mint_first_offer_handoff(\n        db,\n        inquiry_id=ids["inquiry_offer_ready"],\n        account_id=auth["account_id"],\n    )\n    repo = SQLiteEmployeeAuthRepository(db)\n    repo.set_explicit_permissions(auth["account_id"], {"offers.view"})\n    repo.close()\n\n    refreshed = _employee_auth(db)\n    status, body, _headers = _exchange_handoff(\n        base,\n        code=code,\n        session_token=refreshed["session_token"],\n    )\n\n    assert (status, body["error"]) == (403, "forbidden")\n    row = (\n        sqlite3.connect(db)\n        .execute(\n            "SELECT consumed_at FROM configurator_handoffs WHERE id = ?",\n            (handoff_id,),\n        )\n        .fetchone()\n    )\n    assert row == (None,)\n'''
          new = '''def test_permission_revoked_after_mint_rejected(api) -> None:\n    base, ids, db = api\n    super_auth = _employee_auth(db)\n    repo = SQLiteEmployeeAuthRepository(db)\n    service = EmployeeAuthService(repo, service_tokens=_SERVICE_TOKENS)\n    actor = service.authenticate_session(super_auth["session_token"])\n    employee = service.create_account(\n        actor,\n        username="handoff.employee",\n        display_name="Handoff Employee",\n        password="EmployeePassw0rd!",\n        role="USER",\n        explicit_permissions={"offers.view", "offers.prepare"},\n        must_change_password=False,\n    )\n    code, handoff_id = _mint_first_offer_handoff(\n        db,\n        inquiry_id=ids["inquiry_offer_ready"],\n        account_id=employee.id,\n    )\n    repo.set_explicit_permissions(employee.id, {"offers.view"})\n    refreshed = service.authenticate(\n        username="handoff.employee", password="EmployeePassw0rd!"\n    )\n    repo.close()\n\n    status, body, _headers = _exchange_handoff(\n        base,\n        code=code,\n        session_token=refreshed.session_token,\n    )\n\n    assert (status, body["error"]) == (403, "forbidden")\n    row = (\n        sqlite3.connect(db)\n        .execute(\n            "SELECT consumed_at FROM configurator_handoffs WHERE id = ?",\n            (handoff_id,),\n        )\n        .fetchone()\n    )\n    assert row == (None,)\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-superadmin-revoke-test.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_office_api.py .github/workflows/patch-superadmin-revoke-test.yml
          git commit -m "Test permission revocation on assignable user role"
          git push origin HEAD:fix/superadmin-permission-registry
