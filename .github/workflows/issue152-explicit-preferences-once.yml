name: Issue 152 explicit preferences once

on:
  push:
    branches:
      - issue-152-explicit-gastronomic-profile

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-152-explicit-gastronomic-profile
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify lock
        run: uv lock --check
      - name: Install
        run: uv sync --dev
      - name: Format issue files
        run: |
          uv run ruff format \
            src/catering_system/domain/customer_gastronomic_preference.py \
            src/catering_system/repositories/customer_gastronomic_preference_repository.py \
            src/catering_system/repositories/in_memory_customer_gastronomic_preference_repository.py \
            src/catering_system/repositories/sqlite_customer_gastronomic_preference_repository.py \
            tests/unit/test_customer_gastronomic_preference.py \
            tests/unit/test_customer_gastronomic_preference_repositories.py
      - name: Lint
        run: uv run ruff check src tests infra
      - name: Type-check production code
        run: uv run mypy src/catering_system
      - name: Focused issue tests
        run: |
          uv run pytest -q \
            tests/unit/test_customer_gastronomic_preference.py \
            tests/unit/test_customer_gastronomic_preference_repositories.py
      - name: Test Python and enforce coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
      - name: Verify PDF runtime and systemd alignment
        run: uv run python infra/deploy/verify_pdf_runtime.py --repository-only
      - name: Test browser and Worker JavaScript
        run: |
          node --test infra/staging-form/app.test.cjs
          node --test infra/cloudflare_worker/sanitize.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Issue #152: add explicit gastronomic preference persistence"
            git push origin HEAD:issue-152-explicit-gastronomic-profile
          fi
