name: CI

on:
  push:
    branches:
      - feat/order-hard-delete

permissions:
  contents: write

jobs:
  cleanup-order-delete-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/order-hard-delete
          fetch-depth: 0
      - name: Fix stray mixed-language message
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/catering_system/ui/office_panel_http.py')
          s = p.read_text()
          old = 'Ungültiger или fehlender CSRF-Sicherheitstoken.'
          new = 'Ungültiger oder fehlender CSRF-Sicherheitstoken.'
          if old not in s:
              raise SystemExit('target typo not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Restore normal CI and commit cleanup
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/catering_system/ui/office_panel_http.py .github/workflows/ci.yml
          git commit -m "fix: restore German CSRF message"
          git push origin HEAD:feat/order-hard-delete
