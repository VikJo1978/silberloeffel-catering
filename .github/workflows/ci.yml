name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Verify the lock file matches pyproject.toml
        run: uv lock --check
      - name: Install project and development tools
        run: uv sync --dev
      - name: Lint focused Offer files
        run: |
          uv run ruff check src/catering_system/ui/office_panel_offer_detail.py tests/unit/test_office_panel_offer_detail_guided.py
          uv run ruff format --check src/catering_system/ui/office_panel_offer_detail.py tests/unit/test_office_panel_offer_detail_guided.py
      - name: Type-check production code
        run: uv run mypy src/catering_system/ui/office_panel_offer_detail.py
      - name: Test focused Offer presentation
        run: |
          uv run pytest -q tests/unit/test_office_panel_offer_detail_guided.py tests/unit/test_office_panel_offer_actions.py tests/unit/test_offer_panel_budget_block.py
