name: Order Delete RBAC Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-order-delete:
    if: github.head_ref == 'feat/order-hard-delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/order-hard-delete
          fetch-depth: 0
      - name: Apply exact RBAC and nullable fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/catering_system/domain/employee_auth.py')
          lines = auth_path.read_text().splitlines()
          if not any(line.strip() == '"orders.delete",' for line in lines):
              out = []
              count = 0
              for line in lines:
                  out.append(line)
                  if line.strip() == '"orders.cancel",':
                      count += 1
                      if count <= 3:
                          indent = line[: len(line) - len(line.lstrip())]
                          out.append(indent + '"orders.delete",')
              if count < 3:
                  raise SystemExit(f'expected >=3 orders.cancel anchors, got {count}')
              auth_path.write_text('\n'.join(out) + '\n')

          detail_path = Path('src/catering_system/ui/office_panel_order_detail.py')
          detail = detail_path.read_text()
          old = 'if context.current_user_role_label == "Superadmin" and delete_confirmation_name:'
          new = 'if context.can("orders.delete") and delete_confirmation_name:'
          if old in detail:
              detail = detail.replace(old, new, 1)
          elif new not in detail:
              raise SystemExit('order detail delete guard not found')
          detail_path.write_text(detail)

          http_path = Path('src/catering_system/ui/office_panel_http.py')
          http = http_path.read_text()
          http = http.replace(
              '"delete": ("orders.cancel",),',
              '"delete": ("orders.delete",),',
              1,
          )
          http = http.replace(
              'or auth.employee.account.role != "SUPERADMIN"',
              'or "orders.delete" not in auth.employee.effective_permissions',
              1,
          )
          needle = '''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            expected_name = (
'''
          replacement = '''            operational_data = panel._order_detail_operational_data(
                order_id, target.order_version_id
            )
            if operational_data is None:
                raise ValueError("order_delete_name_unavailable")
            expected_name = (
'''
          if needle in http:
              http = http.replace(needle, replacement, 1)
          elif 'if operational_data is None:' not in http:
              raise SystemExit('nullable guard insertion point not found')
          if '"delete": ("orders.delete",),' not in http:
              raise SystemExit('orders.delete POST permission not installed')
          if 'or "orders.delete" not in auth.employee.effective_permissions' not in http:
              raise SystemExit('orders.delete server guard not installed')
          http_path.write_text(http)

          test_path = Path('tests/unit/test_order_hard_delete.py')
          tests = test_path.read_text()
          tests = tests.replace(
              'current_user_role_label="Superadmin",',
              'current_user_role_label="Administrator",\n        employee_effective_permissions=frozenset({"orders.delete"}),',
              1,
          )
          test_path.write_text(tests)
          PY
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - name: Format touched Python files
        run: |
          uv run ruff format \
            src/catering_system/domain/employee_auth.py \
            src/catering_system/ui/office_panel_http.py \
            src/catering_system/ui/office_panel_order_detail.py \
            tests/unit/test_order_hard_delete.py
      - name: Restore normal CI and remove temporary trigger
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/order-delete-patch-trigger.txt
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            src/catering_system/domain/employee_auth.py \
            src/catering_system/ui/office_panel_http.py \
            src/catering_system/ui/office_panel_order_detail.py \
            tests/unit/test_order_hard_delete.py \
            .github/workflows/ci.yml
          if git ls-files --error-unmatch .github/order-delete-patch-trigger.txt >/dev/null 2>&1; then
            git add -- .github/order-delete-patch-trigger.txt
          fi
          git commit -m "fix: authorize order delete by permission"
          git push origin HEAD:feat/order-hard-delete
