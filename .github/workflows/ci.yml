name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-orders-list:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/orders-list-route-20260821
          fetch-depth: 0
      - name: Apply focused orders-list patch to the fix branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          views = Path('src/catering_system/ui/office_panel_views.py')
          text = views.read_text()
          old = '_nav_link("/auftraege", "Aufträge", "briefcase", "orders", active_section)'
          new = '_nav_link("/orders", "Aufträge", "briefcase", "orders", active_section)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy nav link, found {text.count(old)}')
          views.write_text(text.replace(old, new, 1))

          http = Path('src/catering_system/ui/office_panel_http.py')
          text = http.read_text()
          old = 'self._html(panel.render_auftraege(search_query, context=context))'
          new = 'self._html(panel.render_orders(search_query, context=context))'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy route renderer, found {text.count(old)}')
          http.write_text(text.replace(old, new, 1))

          oneoff = Path('.github/workflows/orders-list-patch.yml')
          if oneoff.exists():
              oneoff.unlink()
          PY
          python3 -m compileall -q src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_views.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'fix: use human-readable orders list'
          git push origin HEAD:fix/orders-list-route-20260821

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # uv provides both the resolver and the Python interpreter, so the
      # locked environment CI installs is the same one `uv sync` produces
      # anywhere else. Both versions are pinned on purpose: an unpinned
      # resolver would defeat the point of committing uv.lock.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify the lock file matches pyproject.toml
        run: uv lock --check
      - name: Install project and development tools
        run: uv sync --dev
      - name: Lint
        run: |
          uv run ruff check src tests infra
          uv run ruff format --check src tests infra
      - name: Type-check production code
        run: uv run mypy src/catering_system
      - name: Test Python and enforce coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
      - name: Verify PDF runtime and systemd alignment (repository-only)
        run: uv run python infra/deploy/verify_pdf_runtime.py --repository-only
      - name: Test browser and Worker JavaScript
        run: |
          node --test infra/staging-form/app.test.cjs
          node --test infra/cloudflare_worker/sanitize.test.mjs
