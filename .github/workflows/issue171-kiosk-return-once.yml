name: Issue 171 kiosk return projection once

on:
  push:
    branches:
      - issue-171-kiosk-return-logistics
    paths:
      - .github/workflows/issue171-kiosk-return-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-kiosk-return-logistics

      - uses: astral-sh/setup-uv@v7

      - name: Apply issue 171 kiosk patch
        run: uv run python scripts/issue171_kiosk_return_patch.py

      - name: Format and lint changed Python
        run: |
          uv run ruff format \
            src/catering_system/ui/kiosk_server.py \
            tests/unit/test_kiosk_server.py \
            tests/unit/test_issue171_kiosk_return_logistics.py
          uv run ruff check \
            src/catering_system/ui/kiosk_server.py \
            tests/unit/test_kiosk_server.py \
            tests/unit/test_issue171_kiosk_return_logistics.py

      - name: Type-check production code
        run: uv run mypy src/catering_system

      - name: Test kiosk and issue 171 projection
        run: |
          uv run pytest -q \
            tests/unit/test_kiosk_server.py \
            tests/unit/test_issue171_kiosk_return_logistics.py \
            tests/unit/test_issue171_return_logistics_contract.py \
            tests/unit/test_issue171_return_logistics_domain.py \
            tests/unit/test_issue171_return_logistics_order.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/catering_system/ui/kiosk_server.py \
            tests/unit/test_kiosk_server.py \
            tests/unit/test_issue171_kiosk_return_logistics.py
          git commit -m "Issue #171: project return logistics through kiosk feed"
          git push origin HEAD:issue-171-kiosk-return-logistics
