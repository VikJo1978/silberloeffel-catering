name: CAP-6 formatter diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format --diff tests/unit/test_issue162_recommendation_capacity.py
