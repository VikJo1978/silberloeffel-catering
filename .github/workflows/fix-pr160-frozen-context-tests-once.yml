name: Fix PR160 frozen-context tests once

on:
  push:
    branches:
      - feat/issue-150-freeze-fulfillment-mode

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-150-freeze-fulfillment-mode

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install test environment
        run: uv sync --dev

      - name: Align stale tests with frozen fulfillment semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          path = Path("tests/unit/test_order_confirmation_document.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from catering_system.domain.inquiry_customer_snapshot import InquiryCustomerSnapshot\n",
              "from catering_system.domain.inquiry_customer_snapshot import (\n"
              "    InquiryCustomerSnapshot,\n"
              "    set_inquiry_customer_addresses,\n"
              ")\n",
              "snapshot import",
          )
          text = replace_once(
              text,
              "def _services() -> tuple[\n",
              "def _services(\n"
              "    *,\n"
              "    fulfillment_mode: str = \"PICKUP\",\n"
              "    invoice_address: CustomerAddress | None = None,\n"
              "    delivery_address: CustomerAddress | None = None,\n"
              "    delivery_address_mode: str = \"UNKNOWN\",\n"
              ") -> tuple[\n",
              "services signature",
          )
          start = text.index("    inquiry = inquiries.get_by_id(_INQUIRY_ID)\n")
          end = text.index("    _converted, order, order_version = offer_service.convert_accepted_offer(\n", start)
          replacement = '''    inquiry = inquiries.get_by_id(_INQUIRY_ID)\n    assert inquiry is not None\n    updated_inquiry = replace(\n        inquiry,\n        intake_message="Firma: Example GmbH\\nE-Mail: customer@example.invalid\\n",\n        fulfillment_mode=fulfillment_mode,\n    )\n    if (\n        invoice_address is not None\n        or delivery_address is not None\n        or delivery_address_mode != "UNKNOWN"\n    ):\n        updated_inquiry = set_inquiry_customer_addresses(\n            updated_inquiry,\n            invoice_address=invoice_address,\n            delivery_address=delivery_address,\n            delivery_address_mode=delivery_address_mode,\n        )\n    inquiries.update(updated_inquiry)\n'''
          text = text[:start] + replacement + text[end:]

          pattern = re.compile(
              r"(def test_address_warning_flows_into_confirmation_document\(\) -> None:\n)(.*?)(?=\ndef |\Z)",
              re.S,
          )
          match = pattern.search(text)
          if match is None:
              raise RuntimeError("address warning test not found")
          block = match.group(0)
          block = replace_once(
              block,
              "services = _services()",
              '''services = _services(\n        fulfillment_mode="DELIVERY",\n        invoice_address=CustomerAddress(\n            street="Bürostraße 1", postal_code="20095", city="Hamburg", country="DE"\n        ),\n        delivery_address=CustomerAddress(\n            street="Eventplatz 9", postal_code="20457", city="Hamburg", country="DE"\n        ),\n        delivery_address_mode="SEPARATE",\n    )''',
              "address warning fixture",
          )
          text = text[:match.start()] + block + text[match.end():]
          path.write_text(text, encoding="utf-8")

          path = Path("tests/unit/test_confirmation_address_snapshot_v1.py")
          text = path.read_text(encoding="utf-8")

          def replace_services_call(source: str, test_name: str, replacement: str) -> str:
              pattern = re.compile(
                  rf"(def {re.escape(test_name)}\(\) -> None:\n)(.*?)(?=\ndef |\Z)",
                  re.S,
              )
              match = pattern.search(source)
              if match is None:
                  raise RuntimeError(f"{test_name}: not found")
              block = match.group(0)
              block = replace_once(
                  block,
                  "orders, _offers, inquiries, documents, service, _core, _offer = _services()",
                  replacement,
                  test_name,
              )
              return source[:match.start()] + block + source[match.end():]

          same = '''orders, _offers, inquiries, documents, service, _core, _offer = _services(\n        fulfillment_mode="DELIVERY",\n        invoice_address=_INVOICE,\n        delivery_address=None,\n        delivery_address_mode="SAME_AS_INVOICE",\n    )'''
          separate = '''orders, _offers, inquiries, documents, service, _core, _offer = _services(\n        fulfillment_mode="DELIVERY",\n        invoice_address=_INVOICE,\n        delivery_address=_DELIVERY,\n        delivery_address_mode="SEPARATE",\n    )'''
          for name in (
              "test_a_same_as_invoice_persists_effective_delivery",
              "test_c_persisted_addresses_immutable_after_inquiry_change",
              "test_same_as_invoice_html_may_show_differs_nein",
          ):
              text = replace_services_call(text, name, same)
          for name in (
              "test_b_separate_persists_differs_warning",
              "test_g_api_preview_shape_exposes_address_contract_keys",
          ):
              text = replace_services_call(text, name, separate)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/unit/test_confirmation_effective_delivery_context.py")
          text = path.read_text(encoding="utf-8")
          call = '''services = _services(\n        fulfillment_mode="DELIVERY",\n        invoice_address=_INVOICE,\n        delivery_address=_OLD_DELIVERY,\n        delivery_address_mode="SEPARATE",\n    )'''
          for name in (
              "test_effective_delivery_change_drives_confirmation_context",
              "test_effective_delivery_removal_does_not_fall_back_to_stale_inquiry",
          ):
              pattern = re.compile(
                  rf"(def {re.escape(name)}\(\) -> None:\n)(.*?)(?=\ndef |\Z)",
                  re.S,
              )
              match = pattern.search(text)
              if match is None:
                  raise RuntimeError(f"{name}: not found")
              block = replace_once(match.group(0), "services = _services()", call, name)
              text = text[:match.start()] + block + text[match.end():]
          path.write_text(text, encoding="utf-8")

          path = Path("tests/unit/test_sqlite_repositories.py")
          text = path.read_text(encoding="utf-8")
          marker = '        ("orders", 8),  # frozen operational context per order version\n'
          if '("orders", 9)' not in text:
              text = replace_once(
                  text,
                  marker,
                  marker + '        ("orders", 9),  # frozen fulfillment mode in operational context\n',
                  "migration expectation",
              )
          path.write_text(text, encoding="utf-8")
          PY

          uv run ruff format tests/unit/test_order_confirmation_document.py \
            tests/unit/test_confirmation_address_snapshot_v1.py \
            tests/unit/test_confirmation_effective_delivery_context.py \
            tests/unit/test_sqlite_repositories.py

      - name: Run focused regressions
        run: |
          uv run pytest -q \
            tests/unit/test_confirmation_address_snapshot_v1.py \
            tests/unit/test_confirmation_effective_delivery_context.py \
            tests/unit/test_order_confirmation_document.py \
            tests/unit/test_sqlite_repositories.py

      - name: Commit repairs and remove one-shot workflow
        run: |
          git rm .github/workflows/fix-pr160-frozen-context-tests-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_order_confirmation_document.py \
            tests/unit/test_confirmation_address_snapshot_v1.py \
            tests/unit/test_confirmation_effective_delivery_context.py \
            tests/unit/test_sqlite_repositories.py
          git commit -m "Align confirmation tests with frozen fulfillment context"
          git push origin HEAD:feat/issue-150-freeze-fulfillment-mode
