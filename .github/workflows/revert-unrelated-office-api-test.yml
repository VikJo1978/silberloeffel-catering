name: Revert unrelated office API test

on:
  push:
    branches:
      - fix/superadmin-permission-registry

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/superadmin-permission-registry
          fetch-depth: 0
      - name: Revert unrelated test and self-remove
        run: |
          git fetch origin main
          git checkout origin/main -- tests/unit/test_office_api.py
          rm .github/workflows/revert-unrelated-office-api-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_office_api.py .github/workflows/revert-unrelated-office-api-test.yml
          git commit -m "Clean RBAC migration branch [cleanup-done]"
          git push origin HEAD:fix/superadmin-permission-registry
