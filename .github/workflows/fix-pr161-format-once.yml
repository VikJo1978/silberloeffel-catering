name: Fix PR161 format once

on:
  push:
    branches:
      - feat/issue-151-core-demand-read-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-151-core-demand-read-model
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.32
          python-version: '3.12'
      - run: uv sync --dev
      - name: Format changed Python files
        run: |
          uv run ruff format src/catering_system/services/recommendation_demand_service.py src/catering_system/ui/office_api.py
      - name: Remove one-shot workflow and push
        run: |
          rm .github/workflows/fix-pr161-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catering_system/services/recommendation_demand_service.py src/catering_system/ui/office_api.py .github/workflows/fix-pr161-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format issue 151 demand read model"
          git push origin HEAD:feat/issue-151-core-demand-read-model
