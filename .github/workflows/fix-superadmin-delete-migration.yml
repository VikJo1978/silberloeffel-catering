name: Fix Superadmin delete permission migration

on:
  push:
    branches:
      - fix/superadmin-permission-registry

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/superadmin-permission-registry
      - name: Patch RBAC migration
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('src/catering_system/domain/employee_auth.py')
          text = auth.read_text()
          old = '''def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    if role == "SUPERADMIN":\n        return PERMISSION_SET\n    ceiling = role_ceiling(role)\n'''
          new = '''def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    ceiling = role_ceiling(role)\n'''
          if old not in text:
              raise SystemExit('expected superadmin override not found')
          auth.write_text(text.replace(old, new, 1))

          repo = Path('src/catering_system/repositories/sqlite_employee_auth_repository.py')
          text = repo.read_text()
          needle = '''def _migration_5_audit_target_index(connection: sqlite3.Connection) -> None:\n    connection.execute(_AUDIT_TARGET_TYPE_ID_INDEX)\n\n\n_MIGRATIONS = (\n'''
          replacement = '''def _migration_5_audit_target_index(connection: sqlite3.Connection) -> None:\n    connection.execute(_AUDIT_TARGET_TYPE_ID_INDEX)\n\n\ndef _migration_6_grant_order_delete_to_existing_superadmins(\n    connection: sqlite3.Connection,\n) -> None:\n    connection.execute(\n        """\n        INSERT OR IGNORE INTO account_permissions (account_id, permission_code)\n        SELECT account_id, 'orders.delete'\n        FROM employee_accounts\n        WHERE role = 'SUPERADMIN'\n        """\n    )\n\n\n_MIGRATIONS = (\n'''
          if needle not in text:
              raise SystemExit('migration insertion point not found')
          text = text.replace(needle, replacement, 1)
          needle2 = '''    (5, "audit_target_index", _migration_5_audit_target_index),\n)\n'''
          replacement2 = '''    (5, "audit_target_index", _migration_5_audit_target_index),\n    (\n        6,\n        "grant_order_delete_to_existing_superadmins",\n        _migration_6_grant_order_delete_to_existing_superadmins,\n    ),\n)\n'''
          if needle2 not in text:
              raise SystemExit('migration tuple insertion point not found')
          repo.write_text(text.replace(needle2, replacement2, 1))

          test = Path('tests/unit/test_superadmin_permission_registry.py')
          test.write_text('''import sqlite3\n\nfrom catering_system.domain.employee_auth import effective_permissions\nfrom catering_system.repositories.sqlite_employee_auth_repository import (\n    _migration_6_grant_order_delete_to_existing_superadmins,\n)\n\n\ndef test_superadmin_permissions_remain_explicit() -> None:\n    explicit_permissions = {"orders.view"}\n\n    assert effective_permissions("SUPERADMIN", explicit_permissions) == frozenset(\n        {"orders.view"}\n    )\n\n\ndef test_migration_grants_order_delete_only_to_existing_superadmins() -> None:\n    connection = sqlite3.connect(":memory:")\n    connection.execute(\n        "CREATE TABLE employee_accounts "\n        "(account_id TEXT PRIMARY KEY, role TEXT NOT NULL)"\n    )\n    connection.execute(\n        "CREATE TABLE account_permissions "\n        "(account_id TEXT NOT NULL, permission_code TEXT NOT NULL, "\n        "PRIMARY KEY (account_id, permission_code))"\n    )\n    connection.executemany(\n        "INSERT INTO employee_accounts (account_id, role) VALUES (?, ?)",\n        [("super", "SUPERADMIN"), ("admin", "ADMIN"), ("user", "USER")],\n    )\n    connection.executemany(\n        "INSERT INTO account_permissions (account_id, permission_code) VALUES (?, ?)",\n        [("super", "orders.view"), ("admin", "orders.view"), ("user", "orders.view")],\n    )\n\n    _migration_6_grant_order_delete_to_existing_superadmins(connection)\n    _migration_6_grant_order_delete_to_existing_superadmins(connection)\n\n    rows = set(\n        connection.execute(\n            "SELECT account_id, permission_code FROM account_permissions"\n        ).fetchall()\n    )\n    assert ("super", "orders.delete") in rows\n    assert ("admin", "orders.delete") not in rows\n    assert ("user", "orders.delete") not in rows\n''')

          Path('.github/workflows/fix-superadmin-delete-migration.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catering_system/domain/employee_auth.py src/catering_system/repositories/sqlite_employee_auth_repository.py tests/unit/test_superadmin_permission_registry.py .github/workflows/fix-superadmin-delete-migration.yml
          git commit -m "Fix legacy Superadmin order delete permission [migration-patch]"
          git push origin HEAD:fix/superadmin-permission-registry
