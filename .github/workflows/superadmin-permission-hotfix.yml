name: Superadmin permission hotfix

on:
  push:
    branches:
      - fix/superadmin-permission-registry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/superadmin-permission-registry
      - name: Apply Superadmin registry fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/catering_system/domain/employee_auth.py')
          text = path.read_text()
          old = '''def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    ceiling = role_ceiling(role)\n    return frozenset(\n        permission for permission in explicit_permissions if permission in ceiling\n    )\n'''
          new = '''def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    if role == "SUPERADMIN":\n        return PERMISSION_SET\n    ceiling = role_ceiling(role)\n    return frozenset(\n        permission for permission in explicit_permissions if permission in ceiling\n    )\n'''
          if old not in text:
              raise SystemExit('effective_permissions block not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/unit/test_superadmin_permission_registry.py')
          test_path.write_text('''from catering_system.domain.employee_auth import (\n    PERMISSION_SET,\n    effective_permissions,\n)\n\n\ndef test_superadmin_effective_permissions_follow_current_registry() -> None:\n    legacy_permissions = set(PERMISSION_SET) - {"orders.delete"}\n\n    assert "orders.delete" not in legacy_permissions\n    assert effective_permissions("SUPERADMIN", legacy_permissions) == PERMISSION_SET\n\n\ndef test_non_superadmin_does_not_gain_unassigned_permission() -> None:\n    explicit_permissions = {"orders.view"}\n\n    assert effective_permissions("USER", explicit_permissions) == frozenset({"orders.view"})\n''')

          Path('.github/workflows/superadmin-permission-hotfix.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Superadmin permissions aligned with registry"
          git push origin HEAD:fix/superadmin-permission-registry
