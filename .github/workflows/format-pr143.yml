name: Format PR 143

on:
  push:
    paths:
      - '.github/workflows/format-pr143.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/order-purge-fk-defer
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.32
          python-version: '3.12'
      - run: |
          uv sync --dev
          uv run ruff format tests/unit/test_order_purge_fk_defer.py
          uv run ruff format --check tests/unit/test_order_purge_fk_defer.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/unit/test_order_purge_fk_defer.py
          git commit -m 'Format order purge FK regression test'
          git push origin HEAD:fix/order-purge-fk-defer
