name: Apply superadmin permission migration fix

on:
  push:
    branches:
      - fix/superadmin-permission-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/superadmin-permission-registry
      - name: Patch RBAC migration and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path('src/catering_system/domain/employee_auth.py')
          text = domain.read_text()
          text = text.replace(
              'def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    if role == "SUPERADMIN":\n        return PERMISSION_SET\n    ceiling = role_ceiling(role)\n',
              'def effective_permissions(\n    role: EmployeeRole, explicit_permissions: set[str] | frozenset[str]\n) -> frozenset[str]:\n    ceiling = role_ceiling(role)\n',
          )
          domain.write_text(text)

          repo = Path('src/catering_system/repositories/sqlite_employee_auth_repository.py')
          text = repo.read_text()
          needle = '''def _migration_5_audit_target_index(connection: sqlite3.Connection) -> None:\n    connection.execute(_AUDIT_TARGET_TYPE_ID_INDEX)\n\n\n_MIGRATIONS = (\n'''
          replacement = '''def _migration_5_audit_target_index(connection: sqlite3.Connection) -> None:\n    connection.execute(_AUDIT_TARGET_TYPE_ID_INDEX)\n\n\ndef _migration_6_grant_orders_delete_to_existing_superadmins(\n    connection: sqlite3.Connection,\n) -> None:\n    connection.execute(\n        \"\"\"\n        INSERT OR IGNORE INTO account_permissions (account_id, permission_code)\n        SELECT account_id, 'orders.delete'\n        FROM employee_accounts\n        WHERE role = 'SUPERADMIN'\n        \"\"\"\n    )\n\n\n_MIGRATIONS = (\n'''
          if needle not in text:
              raise SystemExit('migration insertion point not found')
          text = text.replace(needle, replacement)
          text = text.replace(
              '    (5, "audit_target_index", _migration_5_audit_target_index),\n)',
              '    (5, "audit_target_index", _migration_5_audit_target_index),\n    (\n        6,\n        "grant_orders_delete_to_existing_superadmins",\n        _migration_6_grant_orders_delete_to_existing_superadmins,\n    ),\n)',
          )
          repo.write_text(text)

          test = Path('tests/unit/test_superadmin_permission_registry.py')
          test.write_text('''import sqlite3\n\nfrom catering_system.domain.employee_auth import effective_permissions\nfrom catering_system.repositories.sqlite_employee_auth_repository import (\n    _migration_1_create_employee_accounts,\n    _migration_2_create_account_permissions,\n    _migration_6_grant_orders_delete_to_existing_superadmins,\n)\n\n\ndef _insert_account(connection: sqlite3.Connection, account_id: str, role: str) -> None:\n    connection.execute(\n        \"\"\"\n        INSERT INTO employee_accounts (\n            account_id, username, email, display_name, password_hash, role,\n            is_active, must_change_password, created_at, updated_at,\n            deactivated_at, last_login_at, auth_version\n        ) VALUES (?, ?, NULL, ?, 'hash', ?, 1, 0, '2026-08-20T00:00:00+00:00',\n                  '2026-08-20T00:00:00+00:00', NULL, NULL, 1)\n        \"\"\",\n        (account_id, account_id, account_id, role),\n    )\n\n\ndef test_migration_grants_orders_delete_only_to_existing_superadmins() -> None:\n    connection = sqlite3.connect(\":memory:\")\n    _migration_1_create_employee_accounts(connection)\n    _migration_2_create_account_permissions(connection)\n    _insert_account(connection, \"legacy-superadmin\", \"SUPERADMIN\")\n    _insert_account(connection, \"legacy-admin\", \"ADMIN\")\n\n    _migration_6_grant_orders_delete_to_existing_superadmins(connection)\n    _migration_6_grant_orders_delete_to_existing_superadmins(connection)\n\n    rows = connection.execute(\n        \"SELECT account_id, permission_code FROM account_permissions ORDER BY account_id\"\n    ).fetchall()\n    assert rows == [(\"legacy-superadmin\", \"orders.delete\")]\n\n\ndef test_superadmin_permission_can_still_be_revoked_after_migration() -> None:\n    assert effective_permissions(\"SUPERADMIN\", {\"orders.view\"}) == frozenset(\n        {\"orders.view\"}\n    )\n''')

          Path('.github/workflows/fix-superadmin-permission-migration.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catering_system/domain/employee_auth.py src/catering_system/repositories/sqlite_employee_auth_repository.py tests/unit/test_superadmin_permission_registry.py .github/workflows/fix-superadmin-permission-migration.yml
          git commit -m "fix: migrate new permission to existing superadmins"
          git push origin HEAD:fix/superadmin-permission-registry
