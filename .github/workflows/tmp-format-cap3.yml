name: Temporary CAP-3 format

on:
  push:
    branches:
      - feat/issue-162-recommendation-capacity-http

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: format CAP-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-162-recommendation-capacity-http
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format src/catering_system/ui/office_api.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catering_system/ui/office_api.py
          git diff --cached --quiet || git commit -m "style: format CAP-3 Office API"
          git push origin HEAD:feat/issue-162-recommendation-capacity-http
