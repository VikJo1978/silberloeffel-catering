name: One-off human-readable orders list patch

on:
  push:
    branches:
      - fix/human-readable-orders-list
    paths:
      - .github/workflows/oneoff-human-readable-orders.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-readable-orders-list
          fetch-depth: 0

      - name: Replace UUID-centric order list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          panel = Path('src/catering_system/ui/office_panel.py')
          text = panel.read_text()

          old_block = re.compile(
              r'    def render_auftraege\(.*?\n    _ORDERS_ZEITRAUM_LABELS = \(',
              re.S,
          )
          replacement = '''    def render_auftraege(\n        self, q: str = "", *, context: OfficePageContext = _EMPTY_PAGE_CONTEXT\n    ) -> str:\n        """Compatibility route for the legacy /auftraege URL.\n\n        Keep old bookmarks working while showing the same human-readable\n        operational order list as /orders.\n        """\n        return self.render_orders(q=q, context=context)\n\n    _ORDERS_ZEITRAUM_LABELS = ('''
          text, count = old_block.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one render_auftraege block, replaced {count}')

          old_customer = '''        inquiry = self._inquiries.get_by_id(order.source_inquiry_id)\n        kunde = "–"\n        if inquiry is not None:\n            kunde = (\n                (inquiry.intake_subject or "").strip()\n                or inquiry.location_text.strip()\n                or order.order_id[:8]\n            )\n'''
          new_customer = '''        inquiry = self._inquiries.get_by_id(order.source_inquiry_id)\n        kunde = "–"\n        if inquiry is not None:\n            customer = inquiry.customer_snapshot\n            kunde = (\n                ((customer.company_name or "").strip() if customer else "")\n                or ((customer.contact_name or "").strip() if customer else "")\n                or (inquiry.intake_subject or "").strip()\n                or inquiry.location_text.strip()\n                or order.order_id[:8]\n            )\n'''
          if old_customer not in text:
              raise SystemExit('customer display block not found')
          text = text.replace(old_customer, new_customer, 1)

          old_return = '''            "uhrzeit": target.time_window_text if target is not None else "–",\n            "kunde": kunde,\n            "gaeste": target.guest_count_estimate if target is not None else None,\n'''
          new_return = '''            "uhrzeit": target.time_window_text if target is not None else "–",\n            "kunde": kunde,\n            "ort": target.location_text if target is not None else "–",\n            "gaeste": target.guest_count_estimate if target is not None else None,\n'''
          if old_return not in text:
              raise SystemExit('row data block not found')
          text = text.replace(old_return, new_return, 1)

          old_search = '''                for key in ("kunde", "order_id", "uhrzeit")\n'''
          new_search = '''                for key in ("kunde", "ort", "order_id", "uhrzeit")\n'''
          if old_search not in text:
              raise SystemExit('order search fields not found')
          text = text.replace(old_search, new_search, 1)

          old_placeholder = '''            'placeholder="Suche: Kunde / Auftrag">'\n'''
          new_placeholder = '''            'placeholder="Suche: Kunde / Ort / Auftrag">'\n'''
          if old_placeholder not in text:
              raise SystemExit('order search placeholder not found')
          text = text.replace(old_placeholder, new_placeholder, 1)

          old_row = '''                f"<td>{_e(str(row['kunde']))}</td><td>{_e(gaeste)}</td>"\n                f"<td>{_e(str(row['schritt']))}</td>"\n'''
          new_row = '''                f"<td>{_e(str(row['kunde']))}</td><td>{_e(str(row['ort']))}</td>"\n                f"<td>{_e(gaeste)}</td><td>{_e(str(row['schritt']))}</td>"\n'''
          if old_row not in text:
              raise SystemExit('order table row not found')
          text = text.replace(old_row, new_row, 1)

          old_header = '''            + "<table><tr><th>Datum</th><th>Uhrzeit</th><th>Kunde</th>"\n            "<th>Gäste</th><th>Nächster Schritt</th><th>Aktion</th></tr>"\n            + "".join(table_rows or ['<tr><td colspan="6">keine Aufträge</td></tr>'])\n'''
          new_header = '''            + "<table><tr><th>Datum</th><th>Uhrzeit</th><th>Kunde</th><th>Ort</th>"\n            "<th>Gäste</th><th>Nächster Schritt</th><th>Aktion</th></tr>"\n            + "".join(table_rows or ['<tr><td colspan="7">keine Aufträge</td></tr>'])\n'''
          if old_header not in text:
              raise SystemExit('order table header not found')
          text = text.replace(old_header, new_header, 1)

          panel.write_text(text)
          PY

      - name: Syntax check
        run: python3 -m compileall -q src/catering_system/ui/office_panel.py

      - name: Run focused tests
        run: |
          python3 -m pip install -e '.[dev]' >/dev/null
          pytest -q tests -k 'office_panel or orders' --maxfail=1

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/catering_system/ui/office_panel.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show human-readable order list'
          git push origin HEAD:fix/human-readable-orders-list
