name: issue182-format-once
on:
  push:
    branches: [feature-manual-task-office-ui]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-manual-task-office-ui
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_tasks_list.py tests/unit/test_issue182_manual_task_office_ui.py
      - run: |
          git rm .github/workflows/issue182-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_tasks_list.py tests/unit/test_issue182_manual_task_office_ui.py
          git commit -m "Issue #182: format Office task UI"
          git push origin HEAD:feature-manual-task-office-ui
