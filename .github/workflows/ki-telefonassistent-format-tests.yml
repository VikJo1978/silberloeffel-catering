name: KI Telefonassistent test formatter

on:
  push:
    branches:
      - feat/ki-telefonassistent-inbox

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ki-telefonassistent-inbox
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - name: Format added tests
        run: |
          uv run ruff format \
            tests/unit/test_ai_telefon_call_additional.py \
            tests/unit/test_office_panel_ai_telefonist.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_ai_telefon_call_additional.py tests/unit/test_office_panel_ai_telefonist.py
          git commit -m "Format KI Telefonassistent coverage tests"
          git push origin HEAD:feat/ki-telefonassistent-inbox
