name: KI Telefonassistent source formatter

on:
  push:
    branches:
      - feat/ki-telefonassistent-inbox

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ki-telefonassistent-inbox
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --dev
      - name: Format STRATO parser
        run: uv run ruff format src/catering_system/intake/strato_summary_email.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catering_system/intake/strato_summary_email.py
          git commit -m "Format STRATO structured-output schema"
          git push origin HEAD:feat/ki-telefonassistent-inbox
