name: Apply orders list route fix

on:
  push:
    branches:
      - fix/orders-list-route-20260821
    paths:
      - .github/workflows/orders-list-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-list-route-20260821
          fetch-depth: 0

      - name: Apply focused UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          views = Path('src/catering_system/ui/office_panel_views.py')
          text = views.read_text()
          old = '_nav_link("/auftraege", "Aufträge", "briefcase", "orders", active_section)'
          new = '_nav_link("/orders", "Aufträge", "briefcase", "orders", active_section)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy nav link, found {text.count(old)}')
          views.write_text(text.replace(old, new, 1))

          http = Path('src/catering_system/ui/office_panel_http.py')
          text = http.read_text()
          old = 'self._html(panel.render_auftraege(search_query, context=context))'
          new = 'self._html(panel.render_orders(search_query, context=context))'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy route renderer, found {text.count(old)}')
          http.write_text(text.replace(old, new, 1))
          PY

      - name: Syntax check
        run: python3 -m compileall -q src/catering_system/ui/office_panel_http.py src/catering_system/ui/office_panel_views.py

      - name: Install test dependencies
        run: python3 -m pip install -e '.[dev]' >/dev/null

      - name: Focused office panel tests
        run: pytest -q tests/unit/test_office_panel.py tests/unit/test_office_panel_remote.py --maxfail=1

      - name: Remove one-off workflow and commit fix
        run: |
          rm .github/workflows/orders-list-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'fix: use human-readable orders list'
          git push origin HEAD:fix/orders-list-route-20260821
