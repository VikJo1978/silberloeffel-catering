name: Issue 192 format once

on:
  push:
    branches:
      - issue-192-csp-hashed-task-picker

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'Format issue 192 Python')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-192-csp-hashed-task-picker
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Install
        run: uv sync --dev
      - name: Format
        run: |
          uv run ruff format \
            src/catering_system/ui/office_panel_tasks_list.py \
            src/catering_system/ui/office_panel_http.py \
            tests/unit/test_office_panel_manual_tasks_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/catering_system/ui/office_panel_tasks_list.py \
            src/catering_system/ui/office_panel_http.py \
            tests/unit/test_office_panel_manual_tasks_ui.py
          if git diff --cached --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git commit -m "Format issue 192 Python"
          git push
