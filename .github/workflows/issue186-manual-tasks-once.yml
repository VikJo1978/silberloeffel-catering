name: Issue 186 manual tasks once

on:
  push:
    branches:
      - issue-186-manual-task-dashboard-priority

permissions:
  contents: write

jobs:
  patch-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-186-manual-task-dashboard-priority
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply issue 186 integration
        run: python scripts/issue186_patch.py
      - name: Verify lock
        run: uv lock --check
      - name: Install
        run: uv sync --dev
      - name: Format changed Python
        run: |
          uv run ruff format \
            src/catering_system/domain/manual_task.py \
            src/catering_system/repositories/in_memory_manual_task_repository.py \
            src/catering_system/repositories/sqlite_manual_task_repository.py \
            src/catering_system/services/manual_task_service.py \
            src/catering_system/ui/manual_task_presentation.py \
            src/catering_system/ui/office_api.py \
            src/catering_system/ui/remote_core_client.py \
            src/catering_system/ui/office_panel.py \
            src/catering_system/ui/office_panel_http.py \
            src/catering_system/ui/office_panel_dashboard.py \
            src/catering_system/ui/office_panel_tasks_list.py \
            tests/unit/test_issue186_manual_task_priority.py
      - name: Lint
        run: uv run ruff check src tests infra
      - name: Type-check production code
        run: uv run mypy src/catering_system
      - name: Focused tests
        run: |
          uv run pytest -q \
            tests/unit/test_issue186_manual_task_priority.py \
            tests/unit/test_manual_task_office_api.py \
            tests/unit/test_office_panel_manual_tasks_ui.py
      - name: Full Python coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
      - name: Verify PDF runtime
        run: uv run python infra/deploy/verify_pdf_runtime.py --repository-only
      - name: Test JavaScript
        run: |
          node --test infra/staging-form/app.test.cjs
          node --test infra/cloudflare_worker/sanitize.test.mjs
      - name: Commit product changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue186-manual-tasks-once.yml scripts/issue186_patch.py
          git add src tests
          git commit -m "Integrate manual tasks into Arbeitszentrale (#186)"
          git push origin HEAD:issue-186-manual-task-dashboard-priority
