name: Issue 175 kiosk timing once

on:
  push:
    branches:
      - issue-175-kiosk-timing-projection

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply compatibility fix
        run: uv run python scripts_issue175_kiosk_projection_fix.py
      - name: Verify the lock file matches pyproject.toml
        run: uv lock --check
      - name: Install project and development tools
        run: uv sync --dev
      - name: Format
        run: uv run ruff format src tests infra
      - name: Lint
        run: uv run ruff check src tests infra
      - name: Type-check production code
        run: uv run mypy src/catering_system
      - name: Test Python and enforce coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
      - name: Verify PDF runtime and systemd alignment (repository-only)
        run: uv run python infra/deploy/verify_pdf_runtime.py --repository-only
      - name: Test browser and Worker JavaScript
        run: |
          node --test infra/staging-form/app.test.cjs
          node --test infra/cloudflare_worker/sanitize.test.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Issue #175: preserve V2 kiosk payload shape"
          git push
